<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stempeluhr</title>
<meta name="description" content="Persönliche Zeiterfassung mit NFC-Chip">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#f8f7f4; --ink:#15181c; --ink-2:#3b4048; --muted:#6c727c;
  --line:#e5e2db; --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --in:#15803d; --in-soft:#dcf2e3; --out:#c2410c; --out-soft:#fbe6da; --pause:#b45309; --pause-soft:#fbefd5;
  --dg:#4f46e5; --dg-soft:#e4e3fb; --neg:#b91c1c; --pos:#15803d; --warn:#b45309; --warn-soft:#fdf1d8;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.05); --radius:18px;
  --c-u:#0ea5e9; --c-hu:#38bdf8; --c-k:#e11d48; --c-gt:#a855f7; --c-dr:#4f46e5; --c-su:#14b8a6; --c-hol:#94a3b8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090b; --surface:#18181b; --surface-2:#1f1f23; --ink:#f4f4f5; --ink-2:#d4d4d8; --muted:#a1a1aa;
    --line:#2e2e33; --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#12302c;
    --in:#4ade80; --in-soft:#11291b; --out:#fb923c; --out-soft:#2e1b10; --pause:#fbbf24; --pause-soft:#2c230d;
    --dg:#a5b4fc; --dg-soft:#1d1f3a; --neg:#f87171; --pos:#4ade80; --warn:#fbbf24; --warn-soft:#2c230d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#18181b; --surface-2:#1f1f23; --ink:#f4f4f5; --ink-2:#d4d4d8; --muted:#a1a1aa;
  --line:#2e2e33; --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#12302c;
  --in:#4ade80; --in-soft:#11291b; --out:#fb923c; --out-soft:#2e1b10; --pause:#fbbf24; --pause-soft:#2c230d;
  --dg:#a5b4fc; --dg-soft:#1d1f3a; --neg:#f87171; --pos:#4ade80; --warn:#fbbf24; --warn-soft:#2c230d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Google Sans Text","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:17px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand-mark svg{width:18px;height:18px}
.top-right{display:flex;gap:8px;align-items:center}
.demo-badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:4px 8px;border-radius:99px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
h2.section{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
svg.i{width:20px;height:20px;flex:none}

/* Terminal */
.terminal{background:linear-gradient(160deg,#1e293b,#0b1120);color:#e2e8f0;border-radius:24px;padding:20px 20px 18px;box-shadow:0 8px 30px rgba(2,6,23,.35);position:relative;overflow:hidden;border:1px solid #334155}
.terminal::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.terminal::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.22),transparent 70%)}
.t-date{font-size:14px;opacity:.75}
.t-clock{font-size:64px;font-weight:300;letter-spacing:-.03em;line-height:1.05;margin:2px 0 12px}
.t-clock .sec{font-size:26px;opacity:.5;margin-left:4px;font-weight:400}
.t-status{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:7px 12px;border-radius:99px;font-size:14px;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}
.dot.in{background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.2)}
.dot.pause{background:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.2)}
.dot.dg{background:#a5b4fc;box-shadow:0 0 0 4px rgba(165,180,252,.2)}
.t-state{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;position:relative;z-index:1}
.t-lamp{width:18px;height:18px;border-radius:50%;flex:none;background:#ef4444;box-shadow:0 0 0 5px rgba(239,68,68,.18),0 0 18px rgba(239,68,68,.6)}
.st-in .t-lamp{background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.18),0 0 18px rgba(34,197,94,.7)}
.st-pause .t-lamp{background:#eab308;box-shadow:0 0 0 5px rgba(234,179,8,.18),0 0 18px rgba(234,179,8,.7)}
.st-dg .t-lamp{background:#818cf8;box-shadow:0 0 0 5px rgba(129,140,248,.2),0 0 18px rgba(129,140,248,.7)}
.st-in{border-color:rgba(34,197,94,.45)} .st-pause{border-color:rgba(234,179,8,.45)} .st-dg{border-color:rgba(129,140,248,.45)} .st-off{border-color:rgba(239,68,68,.4)}
.t-state-l{font-size:20px;font-weight:700;letter-spacing:.01em}
.t-state-s{font-size:13px;opacity:.75;margin-top:1px}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
table.hist th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:700;padding:8px 4px}
table.hist td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.hist .r{text-align:right}
table.hist tr{cursor:pointer}
table.hist tr.hday td{background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2);padding:6px 6px}
.bk-ico.sm{width:22px;height:22px;border-radius:7px;display:inline-grid;vertical-align:middle;margin-right:7px}
.bk-ico.sm svg{width:13px;height:13px}
svg.ti{width:12px;height:12px;vertical-align:-1px;margin-right:3px}
.undo-bar{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:14px;font-size:14px;z-index:85;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.undo-bar button{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.c-undo{margin-top:22px;background:#fff;color:#111;border:none;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.t-nfc{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;opacity:.9}
.t-nfc button{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pulse{width:10px;height:10px;border-radius:50%;background:#2dd4bf;position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #2dd4bf;animation:pulse 1.8s infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.key{border:none;border-radius:18px;padding:16px 14px;min-height:84px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;font-weight:700;font-size:17px;text-align:left;transition:transform .08s ease,opacity .2s}
.key:active{transform:scale(.97)}
.key small{font-weight:500;font-size:12px;opacity:.75}
.key svg{width:24px;height:24px}
.key.in{background:var(--in);color:#fff}
.key.out{background:var(--out);color:#fff}
.key.pause{background:var(--pause-soft);color:var(--pause);border:1px solid color-mix(in srgb,var(--pause) 25%,transparent)}
.key.dg{background:var(--dg-soft);color:var(--dg);border:1px solid color-mix(in srgb,var(--dg) 25%,transparent)}
.key.info{background:var(--surface);color:var(--ink);border:1px solid var(--line);grid-column:span 2;min-height:56px;flex-direction:row;align-items:center;justify-content:center;font-size:15px}
.key[disabled]{opacity:.32;cursor:not-allowed;transform:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .key.in,:root:not([data-theme="light"]) .key.out{color:#0b0f0e}}
:root[data-theme="dark"] .key.in,:root[data-theme="dark"] .key.out{color:#0b0f0e}

/* today */
.progress{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:12px 0 8px}
.progress > div{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.big-num{font-size:30px;font-weight:600;letter-spacing:-.02em}
.timeline{position:relative;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);margin:14px 0 4px;overflow:hidden}
.timeline .seg{position:absolute;top:3px;bottom:3px;border-radius:5px}
.timeline .seg.work{background:var(--accent)}
.timeline .seg.dg{background:var(--dg)}
.timeline .seg.pause{background:repeating-linear-gradient(45deg,var(--pause) 0 4px,transparent 4px 8px);opacity:.7}
.timeline .seg.open{opacity:.55}
.timeline .now{position:absolute;top:0;bottom:0;width:2px;background:var(--neg)}
.tl-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.bookings{display:flex;flex-direction:column;margin-top:12px}
.bk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:none}
.bk-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.bk-ico svg{width:17px;height:17px}
.bk-ico.in,.bk-ico.pe,.bk-ico.de{background:var(--in-soft);color:var(--in)}
.bk-ico.out{background:var(--out-soft);color:var(--out)}
.bk-ico.ps{background:var(--pause-soft);color:var(--pause)}
.bk-ico.ds{background:var(--dg-soft);color:var(--dg)}
.bk-time{font-weight:700;font-size:16px;width:52px}
.bk-src{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.stat-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat-val{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:2px}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:120px;margin-top:10px}
.wbar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wbar .col{width:100%;max-width:38px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;position:relative;height:80px;overflow:hidden}
.wbar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:6px 6px 0 0}
.wbar .fill.abs{background:var(--c-u)}
.wbar .soll{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--ink-2);opacity:.5}
.wbar .lbl{font-size:12px;color:var(--muted);font-weight:600}
.wbar.today .lbl{color:var(--accent)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;cursor:pointer}
.alert svg{color:var(--warn)}

/* journal */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.month-nav h3{margin:0;font-size:20px;letter-spacing:-.01em}
.sumbox{text-align:center;padding:12px 6px}
.sumbox .v{font-size:19px;font-weight:600;margin-top:2px}
.days{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.day{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.day:first-child{border-top:none}
.day:active{background:var(--surface-2)}
.day.we{background:var(--surface-2)}
.day.we .d-main{color:var(--muted)}
.day.today{box-shadow:inset 3px 0 0 var(--accent)}
.day.future .d-main,.day.future .d-right{opacity:.5}
.d-date{line-height:1.1}
.d-date b{display:block;font-size:17px}
.d-date span{font-size:12px;color:var(--muted);font-weight:600}
.d-main{font-size:14px;min-width:0}
.d-main .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-right{text-align:right;font-size:14px}
.d-right b{display:block}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;margin-right:4px;vertical-align:1px}
.badge.u{background:color-mix(in srgb,var(--c-u) 18%,transparent);color:var(--c-u)}
.badge.hu{background:color-mix(in srgb,var(--c-hu) 18%,transparent);color:var(--c-hu)}
.badge.k{background:color-mix(in srgb,var(--c-k) 15%,transparent);color:var(--c-k)}
.badge.gt{background:color-mix(in srgb,var(--c-gt) 15%,transparent);color:var(--c-gt)}
.badge.dr{background:color-mix(in srgb,var(--c-dr) 15%,transparent);color:var(--c-dr)}
.badge.su{background:color-mix(in srgb,var(--c-su) 15%,transparent);color:var(--c-su)}
.badge.hol{background:color-mix(in srgb,var(--c-hol) 22%,transparent);color:var(--ink-2)}
.badge.err{background:var(--warn-soft);color:var(--warn)}
.badge.st-beantragt{background:var(--warn-soft);color:var(--warn)}
.badge.st-genehmigt{background:var(--in-soft);color:var(--in)}
.badge.st-abgelehnt{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.badge.st-storniert{background:var(--surface-2);color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--neg)}
.btn.block{width:100%}
.btn.grow{flex:1}

/* accounts */
.acc{display:flex;flex-direction:column}
.acc-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.acc-row:first-child{border-top:none}
.acc-row b{font-weight:600}
.acc-hero{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.acc-hero .big-num{font-size:38px}
.ring{width:84px;height:84px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;background:var(--surface-2);cursor:pointer}
.cal .c.empty{background:transparent;cursor:default}
.cal .c.we{color:var(--muted);background:transparent}
.cal .c.today{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.cal .c .code{font-size:8.5px;font-weight:700;line-height:1.05;margin-top:2px;text-align:center;hyphens:manual;max-width:100%;padding:0 2px;overflow-wrap:anywhere}
.cal .c.a-u{background:var(--c-u);color:#fff}.cal .c.a-hu{background:linear-gradient(135deg,var(--c-hu) 50%,var(--surface-2) 50%)}
.cal .c.a-k{background:var(--c-k);color:#fff}.cal .c.a-gt{background:var(--c-gt);color:#fff}
.cal .c.a-dr{background:var(--c-dr);color:#fff}.cal .c.a-su{background:var(--c-su);color:#fff}
.cal .c.hol{background:transparent;border:1px dashed var(--c-hol);color:var(--muted)}
.cal .c.pending{opacity:.55}
.cal .c.sel{background:var(--c-u);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.cal .c.sel-half{background:linear-gradient(135deg,var(--c-u) 50%,var(--surface-2) 50%);box-shadow:inset 0 0 0 2px var(--c-u)}
.cal .c.sel .code,.cal .c.sel-half .code{color:inherit}
.selbar{margin-top:12px;border:1px solid color-mix(in srgb,var(--c-u) 45%,transparent);background:color-mix(in srgb,var(--c-u) 10%,var(--surface))}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 11px;cursor:pointer}
.type-opt i{width:12px;height:12px;border-radius:4px;flex:none;margin-top:4px}
.type-opt b{display:block;font-size:14px;font-weight:600}
.type-opt small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.type-opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--surface)}
.page-title{font-size:22px;letter-spacing:-.01em;margin:6px 4px 8px}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ov-grid .card.ov{padding:12px 10px;margin:0}
.ov-v{font-size:22px;font-weight:700;margin-top:2px}
.ov-grid .stat-label{font-size:10.5px}
.ov-grid .stat-sub{font-size:11px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.mail-prev{white-space:pre-wrap;font-size:14px;line-height:1.55;min-height:300px;resize:vertical}
.cal .c.pending::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.req{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.req:first-child{border-top:none}
.req-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:#fff}
.req-body{flex:1;min-width:0}
.req-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.req-actions .btn{padding:7px 11px;font-size:13px}

/* team */
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:none}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);border:1px solid var(--line);flex:none;position:relative}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;border:2px solid var(--surface);width:12px;height:12px;box-shadow:none}

/* menu list */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.menu-item:first-child{border-top:none}
.menu-item .mi-ico{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.menu-item .mi-ico svg{width:19px;height:19px}
.menu-item .chev{margin-left:auto;color:var(--muted)}
.menu-item b{display:block;font-weight:600}
.menu-item span.s{font-size:13px;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.soll-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.soll-grid .input{padding:10px 2px;text-align:center;font-size:14px}
.soll-grid label{font-size:11px;text-align:center;font-weight:700;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:none}
.toggle{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(18px)}
.seg-ctl{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg-ctl button{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg-ctl button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button .pill{padding:3px 16px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .pill{background:var(--accent-soft);color:var(--accent)}
nav.tabs .cnt{position:absolute;top:4px;left:calc(50% + 8px);background:var(--warn);color:#fff;font-size:10px;font-weight:800;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}

/* sheet & dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
.scrim.show{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .22s ease}
.scrim.show .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 2px;font-size:20px;letter-spacing:-.01em}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:6px}
.edit-row{display:grid;grid-template-columns:1fr 104px 40px;gap:8px;align-items:center;margin-top:8px}
.edit-row .input{padding:9px 10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;z-index:80;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* confirmation */
.confirm{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
.confirm.show{opacity:1;pointer-events:auto}
.confirm.k-in,.confirm.k-pe,.confirm.k-de{background:linear-gradient(160deg,#16a34a,#0f5f30)}
.confirm.k-out{background:linear-gradient(160deg,#ea580c,#9a3412)}
.confirm.k-ps{background:linear-gradient(160deg,#d97706,#92400e)}
.confirm.k-ds{background:linear-gradient(160deg,#4f46e5,#312e81)}
.confirm.k-warn{background:linear-gradient(160deg,#475569,#1e293b)}
.c-icon{width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;margin-bottom:22px;transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.confirm.show .c-icon{transform:scale(1)}
.c-icon svg{width:54px;height:54px}
.c-kind{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.c-time{font-size:76px;font-weight:300;letter-spacing:-.03em;line-height:1.05;margin:4px 0 6px}
.c-msg{font-size:20px;font-weight:500}
.c-stats{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.c-stats div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-size:13px;min-width:110px}
.c-stats b{display:block;font-size:19px;font-weight:600;margin-top:2px}
.c-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:13px;opacity:.7}

.empty-state{text-align:center;padding:24px 10px;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:10px}
.kv div:nth-child(even){text-align:right;font-weight:600}
code.url{display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;word-break:break-all;margin-top:8px}
.log-item{padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.log-item:first-child{border-top:none}
.hidden{display:none!important}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .app,nav.tabs,.toast,.confirm,.scrim{display:none!important}
  #print{display:block;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;color:#000}
  #print h1{font-size:16pt;margin:0 0 2mm}
  #print table{width:100%;border-collapse:collapse;margin-top:5mm}
  #print th,#print td{border-bottom:.3mm solid #bbb;padding:1.4mm 1.5mm;text-align:left}
  #print th{background:#eee;font-size:9pt}
  #print td.r,#print th.r{text-align:right}
  #print tr.we td{color:#777}
  #print .meta{display:flex;justify-content:space-between;font-size:10pt;color:#333}
  #print .tot td{font-weight:bold;border-top:.5mm solid #000}
  #print .sign{display:flex;gap:20mm;margin-top:18mm}
  #print .sign div{flex:1;border-top:.3mm solid #000;padding-top:1.5mm;font-size:9pt}
  #print .box{border:.3mm solid #000;padding:4mm;margin-top:8mm}
  #print .box h2{font-size:11pt;margin:0 0 3mm}
  #print .chk{display:inline-block;width:3.5mm;height:3.5mm;border:.3mm solid #000;margin:0 2mm 0 6mm;vertical-align:-.5mm}
  @page{size:A4;margin:14mm}
}
</style>

"use strict";
/* ============ Grundlagen ============ */
const KEY = 'stempeluhr.v2';
const APP_VERSION = '3.1 · 04.11.2026';
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const KIND = {
  in:{label:'Kommen', icon:'i-in'}, out:{label:'Gehen', icon:'i-out'},
  ps:{label:'Pause Beginn', icon:'i-pause'}, pe:{label:'Pause Ende', icon:'i-pause'},
  ds:{label:'Dienstgang Beginn', icon:'i-dg'}, de:{label:'Dienstgang Ende', icon:'i-dg'}
};
const TARGET = {in:'in', out:'out', ps:'pause', pe:'in', ds:'dg', de:'in'};
const ALLOWED = { out:['in','ds'], in:['out','ps','ds'], pause:['pe','out'], dg:['de','out'] };
const ABS = {
  u:{cell:'Urlaub', label:'Urlaub', desc:'Ganzer Urlaubstag', credit:1, vac:1},
  hu:{cell:'½ Urlaub', label:'Halber Urlaubstag', desc:'Nur ein halber Tag frei', credit:.5, vac:.5},
  k:{cell:'Krank', label:'Krank', desc:'Arbeitsunfähig, z. B. mit Krankmeldung', credit:1},
  gt:{cell:'Gleit­tag', label:'Gleittag', desc:'Freier Tag aus Überstunden', credit:0},
  dr:{cell:'Dienst­reise', label:'Dienstreise', desc:'Ganztägig beruflich unterwegs', credit:1},
  su:{cell:'Sonder­urlaub', label:'Sonderurlaub', desc:'z. B. Hochzeit, Umzug, Todesfall', credit:1}
};
const SRC = {nfc:'NFC-Chip', chip:'Chip', app:'App', korr:'Korrektur', demo:'Demo'};

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate()+n); return dkey(d); };
const hm = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const minOfDay = ts => { const d = new Date(ts); return d.getHours()*60 + d.getMinutes(); };
const todayKey = () => dkey(new Date());
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const svg = (id, cls='i') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
function dur(min, signed=false){
  const neg = min < 0; const m = Math.round(Math.abs(min));
  const s = `${Math.floor(m/60)}:${pad(m%60)}`;
  if (neg && m>0) return '−' + s;
  return (signed && m>0 ? '+' : '') + s;

/* ============ Berechnung ============ */
function applyBreak(gross, legal){
  // ArbZG §4: bei MEHR ALS 6 Std. Arbeit mind. 30 Min., bei MEHR ALS 9 Std. mind. 45 Min. Ruhepause.
  // "legal" = gebuchte Pausen, die als Ruhepause zählen (nur Blöcke ab 15 Min.).
  // Kappung: Der Abzug drückt die Arbeitszeit nie unter die jeweilige Schwelle.
  const P = Math.max(30, S.settings.pause||0);
  let net = gross, ded = 0, req = 0;
  if (gross > 360){
    req = P; ded = Math.max(0, P - legal); net = gross - ded;
    if (ded > 0 && net < 360){ net = 360; ded = gross - 360; }
    if (net > 540){
      const d2 = Math.max(0, 45 - legal); let n2 = gross - d2;
      if (d2 > 0 && n2 < 540) n2 = 540;
      if (n2 < net){ net = n2; ded = gross - n2; }
      req = Math.max(req, 45);
    }
  }
  const short = ded; // fehlende Pflichtpause in Minuten
  if (S.settings.pauseMode !== 'abzug') return {net:gross, ded:0, short, req};  // Standard: nur gestempelte Pausen zählen
  return {net, ded, short, req};
}
function stateAfter(list){ let st = 'out'; for (const s of list) st = TARGET[s.type]; return st; }
function calcDay(k, nowMs = Date.now()){
  const list = IDX[k] || [];
  const hol = holidayOf(k); const absE = ABSMAP[k]; const abs = absE && !absE.pending ? absE.type : null;
  const soll = hol ? 0 : sollBase(k);
  const isToday = k === dkey(new Date(nowMs));
  let st = 'out', prev = null, gross = 0, gaps = 0, legal = 0, dgMin = 0, err = false; const segs = [];
  for (const s of list){
    const m = minOfDay(s.ts);
    if (prev !== null){
      const span = m - prev;
      if (st === 'in' || st === 'dg'){ gross += span; if (st==='dg') dgMin += span; segs.push({a:prev,b:m,t:st==='dg'?'dg':'work'}); }
      else { gaps += span; if (span >= 15) legal += span; if (st==='pause') segs.push({a:prev,b:m,t:'pause'}); }
    }
    if (!ALLOWED[st].includes(s.type)) err = true;
    st = TARGET[s.type]; prev = m;
  }
  let open = false, missing = false;
  if (st !== 'out' && prev !== null){
    if (isToday){ const nm = minOfDay(nowMs); const span = Math.max(0, nm - prev);
      if (st==='in'||st==='dg'){ gross += span; if (st==='dg') dgMin += span; segs.push({a:prev,b:nm,t:st==='dg'?'dg':'work',open:true}); }
      else { segs.push({a:prev,b:nm,t:'pause',open:true}); if (span >= 15) legal += span; gaps += span; }
      open = true;
    } else missing = true;
  }
  const {net, ded, short, req} = applyBreak(gross, legal);
  // Ruhezeit ArbZG §5: mind. 11 Std. zwischen Arbeitsende und nächstem Arbeitsbeginn
  let rest = null;
  if (list.length){
    const first = list[0].ts;
    for (let i = 1; i <= 3 && rest === null; i++){
      const pl = IDX[addDays(k,-i)]; if (pl && pl.length){ const lo = pl[pl.length-1]; if (lo.type==='out') rest = Math.round((first - lo.ts)/60000); else break; }
    }
  }
  const restWarn = rest !== null && rest < 660 ? rest : null;
  const credit = abs ? soll * ABS[abs].credit : 0;
  const ist = net + credit;
  const diff = ist - soll;
  return {k, list, hol, abs, absPending: absE && absE.pending ? absE.type : null, soll, gross, gaps, legal, ded, short, req, restWarn, net, credit, ist, diff, dgMin, st, open, missing, err, segs, isToday};
}

const inAccount = k => !!S.settings.startDate && k >= S.settings.startDate;
function saldoUntil(endKeyExcl){
  let s = S.settings.startSaldo || 0;
  const start = S.settings.startDate; if (!start) return s;
  for (let k = start; k < endKeyExcl; k = addDays(k,1)) s += calcDay(k).diff;
  return s;
}
function saldoNow(){
  const t = todayKey(); let s = saldoUntil(t);
  const d = calcDay(t);
  const todayClosed = d.st === 'out' && (d.list.length || d.abs);
  return {base:s, incl: todayClosed ? s + d.diff : s, todayClosed, today:d};
}
function vacation(year = new Date().getFullYear()){
  const t = todayKey(); let taken = 0, planned = 0, requested = 0;
  for (const r of S.requests){
    if (r.kind!=='abs' || !ABS[r.type].vac) continue;
    for (let k = r.from; k <= r.to; k = addDays(k,1)){
      if (+k.slice(0,4) !== year || !isWorkday(k)) continue;
      const v = ABS[r.type].vac;

}

const NFC = { supported: 'NDEFReader' in window, scanning:false, reader:null, mode:null, learnCb:null };
async function nfcStart(silent){
  if (!NFC.supported){ if(!silent) toast('NFC geht nur in Chrome auf Android (über https)'); return; }
  if (!silent && S.settings.nfcOff){ S.settings.nfcOff = false; save(); }
  if (NFC.scanning) return;
  try {
    NFC.ctrl = new AbortController();
    NFC.reader = new NDEFReader();
    await NFC.reader.scan({signal: NFC.ctrl.signal});
    NFC.scanning = true;
    NFC.reader.onreading = onTag;
    NFC.reader.onreadingerror = () => toast('Chip nicht lesbar – bitte nochmal ranhalten');
    render();

}
function nfcStop(){
  try { NFC.ctrl && NFC.ctrl.abort(); } catch(_){}

}
function onTag(e){
  if (NFC.mode === 'write') return;

  let kind = null;
  for (const r of e.message.records){
    if (r.recordType === 'url' || r.recordType === 'absolute-url'){
      try { const url = new TextDecoder().decode(r.data); const m = url.match(/[?&]stempel=(\w+)/); if (m) kind = m[1]; } catch(_){}
    }
  }
  if (kind){ book(kind==='kommen'?'in':kind==='gehen'?'out':'auto', 'nfc'); return; }
  const chip = S.settings.chips.find(c => c.serial && c.serial === serial);
  if (chip){ book('auto', 'chip'); return; }
  dialog('Unbekannter Chip', `Dieser Chip ist noch nicht angelernt${serial?` (Nr. <span class="num">${esc(serial)}</span>)`:''}. Jetzt als Stempel-Chip speichern?`,
    [{label:'Abbrechen'},{label:'Anlernen', primary:true, value:true}]).then(ok => { if (ok) addChip(serial); });
}
function addChip(serial){
  if (!serial){ toast('Dieser Chip hat keine lesbare Nummer – bitte Aufkleber beschreiben'); return; }
  if (S.settings.chips.some(c=>c.serial===serial)){ toast('Chip ist bereits angelernt'); return; }
  S.settings.chips.push({serial, name:'Chip ' + (S.settings.chips.length+1), added:Date.now()});
  log(`Chip angelernt (${serial})`); save(); render(); toast('Chip angelernt ✓ – ab jetzt einfach ranhalten');
}

  if (!NFC.supported){ toast('Beschreiben geht nur in Chrome auf Android'); return; }
  const ctrl = new AbortController(); NFC.mode = 'write';
  const close = sheet(`<h3>Aufkleber beschreiben</h3><div class="sub">Halte jetzt den NFC-Aufkleber an die Rückseite deines Handys (Mitte, unterhalb der Kamera).</div>
    <div style="display:grid;place-items:center;padding:26px 0"><div class="pulse" style="width:18px;height:18px"></div></div>
    <code class="url">${esc(stampUrl(kind))}</code><div class="actions"><button class="btn block" id="wCancel">Abbrechen</button></div>`,

// Arbeitszeit eines Tages bis einschließlich Buchung i (Zwischenstand)
function workUntil(list, i){
  let st = 'out', prev = null, w = 0;
  for (let j = 0; j <= i; j++){ const m = minOfDay(list[j].ts); if (prev !== null && (st==='in'||st==='dg')) w += m - prev; st = TARGET[list[j].type]; prev = m; }
  return w;
}
function historyTable(){
  const all = S.stamps; if (!all.length) return `<div class="empty-state">Noch keine Buchungen.<br>Halte deinen Chip ans Handy oder tippe auf „Kommen“.</div>`;
  const rows = []; let lastDay = null; const t = todayKey();
  for (let i = all.length-1, n = 0; i >= 0 && n < 14; i--, n++){
    const s = all[i]; const k = dkey(new Date(s.ts)); const list = IDX[k] || []; const idx = list.findIndex(x=>x.id===s.id);
    if (k !== lastDay){ const dd = calcDay(k); rows.push(`<tr class="hday" data-open-day="${k}"><td colspan="3">${k===t?'Heute':longDate(k).replace(/ \d{4}$/,'')}</td><td class="r num">${dur(dd.net)}<span class="${sCls(dd.diff)}"> (${dur(dd.diff,true)})</span></td></tr>`); lastDay = k; }
    rows.push(`<tr data-open-day="${k}"><td class="num"><b>${hm(s.ts)}</b></td><td><span class="bk-ico sm ${s.type}">${svg(KIND[s.type].icon)}</span>${KIND[s.type].label}</td><td class="muted tiny">${s.src==='nfc'||s.src==='chip'?svg('i-nfc','i ti'):''}${esc(SRC[s.src]||'')}</td><td class="r num">${dur(workUntil(list, idx))}</td></tr>`);
  }
  return `<table class="hist"><thead><tr><th>Zeit</th><th>Buchungsart</th><th>Quelle</th><th class="r">Ist bis hier</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
function viewBuchen(){
  const now = new Date(); const k = todayKey(); const sal = saldoNow(); const d = sal.today; const vac = vacation();
  const st = statusText(d);
  const can = t => ALLOWED[d.st].includes(t) || (t==='in' && (d.st==='pause'||d.st==='dg'));
  const pauseKind = d.st==='pause' ? 'pe' : 'ps';
  const dgKind = d.st==='dg' ? 'de' : 'ds';
  const pct = d.soll ? Math.min(100, d.net / d.soll * 100) : 0;
  // Feierabend-Prognose
  let fe = '';
  if (d.st==='in' || d.st==='dg'){
    const nowM = minOfDay(Date.now());
    let need = null; for (let add = 0; add <= 900; add++){ if (applyBreak(d.gross+add, d.legal).net >= d.soll){ need = add; break; } }
    let max10 = null; for (let add = 0; add <= 900; add++){ if (applyBreak(d.gross+add, d.legal).net >= 600){ max10 = add; break; } }
    const at = m => { const t = nowM + m; return t >= 1440 ? '–' : `${pad(Math.floor(t/60))}:${pad(t%60)}`; };
    if (d.soll && need !== null) fe = `<div class="kv"><div class="muted">Sollzeit erreicht um</div><div class="num">${need===0?'erreicht ✓':at(need)} Uhr</div><div class="muted">10 h Höchstarbeitszeit um</div><div class="num">${at(max10)} Uhr</div></div>`;
  }
  // Timeline 6–20 Uhr
  const T0 = 360, T1 = 1200; const pos = m => Math.max(0, Math.min(100, (m - T0) / (T1 - T0) * 100));
  const segs = d.segs.map(s => `<div class="seg ${s.t} ${s.open?'open':''}" style="left:${pos(s.a)}%;width:${Math.max(.6,pos(s.b)-pos(s.a))}%"></div>`).join('');
  const nowM = minOfDay(Date.now());
  const tl = `<div class="timeline">${segs}${nowM>=T0&&nowM<=T1?`<div class="now" style="left:${pos(nowM)}%"></div>`:''}</div><div class="tl-scale"><span>6</span><span>9</span><span>12</span><span>15</span><span>18</span><span>20</span></div>`;
  // Warnungen: offene Tage
  const warnDays = []; for (let i = 1; i <= 31; i++){ const kk = addDays(k,-i); if (S.settings.startDate && kk < S.settings.startDate) break; const dd = calcDay(kk); if (dd.missing || dd.err) warnDays.push(kk); }
  const al = (ico, title, text, attr='') => `<div class="alert" ${attr}>${svg(ico)}<div><b>${title}</b><br><span class="small">${text}</span></div></div>`;
  let warn = warnDays.length ? al('i-warn', `Fehlbuchung am ${shortDate(warnDays[0])}`, `${warnDays.length>1?`Insgesamt ${warnDays.length} Tage mit fehlender Buchung. `:''}Tippe hier, um die Buchung zu korrigieren.`, `data-open-day="${warnDays[0]}"`) : '';
  if (d.restWarn !== null) warn += al('i-warn', 'Ruhezeit unterschritten', `Seit deinem letzten Arbeitsende sind nur ${dur(d.restWarn)} Std. vergangen. Nach § 5 ArbZG sind mindestens 11 Std. Ruhezeit vorgeschrieben.`);
  if ((d.st==='in'||d.st==='dg') && d.net >= 570) warn += al('i-warn', d.net >= 600 ? 'Höchstarbeitszeit überschritten' : 'Höchstarbeitszeit bald erreicht', `Heute bereits ${dur(d.net)} Std. Nach § 3 ArbZG sind höchstens 10 Std. pro Tag erlaubt.`);
  if (S.settings.pauseMode==='hinweis' && d.short > 0) warn += al('i-pause', 'Pflichtpause fehlt', `Es fehlen ${d.short} Min. Ruhepause (ab 6 Std. Arbeit 30 Min., ab 9 Std. 45 Min.; nur Pausen ab 15 Min. zählen). Es wird nichts automatisch abgezogen.`);
  const lb = S.settings.lastBackup || 0;
  if (S.stamps.length >= 10 && !S.demo && Date.now() - lb > 30*864e5) warn += al('i-db', 'Sicherung empfohlen', lb ? `Letzte Sicherung am ${new Date(lb).toLocaleDateString('de-DE')}. Tippe hier, um jetzt zu sichern.` : 'Du hast noch keine Sicherung gespeichert. Tippe hier, um jetzt zu sichern.', 'data-backup');
  // Woche
  const mon = addDays(k, -((now.getDay()+6)%7));
  const wk = [0,1,2,3,4].map(i => { const kk = addDays(mon,i); const dd = calcDay(kk); const max = 600; const h = Math.min(100, dd.ist/max*100); const sh = dd.soll/max*100;
    return `<div class="wbar ${kk===k?'today':''}"><div class="num tiny muted">${dd.ist?dur(dd.ist):''}</div><div class="col"><div class="fill ${dd.abs?'abs':''}" style="height:${h}%"></div>${dd.soll?`<div class="soll" style="bottom:${sh}%"></div>`:''}</div><div class="lbl">${WD[fromKey(kk).getDay()]}</div></div>`; }).join('');
  const wSum = [0,1,2,3,4,5,6].reduce((a,i)=>{ const dd = calcDay(addDays(mon,i)); a.ist+=dd.ist; a.soll+=dd.soll; return a; },{ist:0,soll:0});
  const hol = holidayOf(k);
  const nfcRow = NFC.supported
    ? (NFC.scanning ? `<div class="t-nfc"><div class="pulse"></div><span>Chip-Leser aktiv – Chip ans Handy halten</span><button id="nfcOff">Aus</button></div>`
                    : `<div class="t-nfc">${svg('i-nfc')}<span>Chip-Leser ist aus</span><button id="nfcOn">Einschalten</button></div>`)
    : `<div class="t-nfc">${svg('i-nfc')}<span>NFC-Aufkleber stempelt auch, wenn die App zu ist</span></div>`;
  return `
  <section class="terminal">
    <div class="t-date">${WDL[now.getDay()]}, ${now.getDate()}. ${MON[now.getMonth()]}${hol?` · ${esc(hol)}`:''}</div>
    <div class="t-clock num" id="clock">${pad(now.getHours())}:${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span></div>
    <div class="t-state st-${st.dot}"><span class="t-lamp"></span><div><div class="t-state-l">${st.label}</div><div class="t-state-s"><span class="num" id="statusDur" data-since="${st.since||''}">${sinceText(st.since)}</span>${st.since?` · seit ${hm(st.since)}`:''}</div></div></div>
    ${nfcRow}
  </section>
  <div class="keys">
    <button class="key in" data-book="in" ${can('in')&&d.st==='out'?'':'disabled'}>${svg('i-in')}<span>Kommen<br><small>Arbeitsbeginn</small></span></button>
    <button class="key out" data-book="out" ${can('out')?'':'disabled'}>${svg('i-out')}<span>Gehen<br><small>Arbeitsende</small></span></button>
    <button class="key pause" data-book="${pauseKind}" ${can(pauseKind)?'':'disabled'}>${svg('i-pause')}<span>${d.st==='pause'?'Pause Ende':'Pause'}<br><small>${d.st==='pause'?'zurück an die Arbeit':'Pause beginnen'}</small></span></button>
    <button class="key dg" data-book="${dgKind}" ${can(dgKind)?'':'disabled'}>${svg('i-dg')}<span>${d.st==='dg'?'Dienstgang Ende':'Dienstgang'}<br><small>${d.st==='dg'?'zurück im Betrieb':'z. B. Kundentermin'}</small></span></button>
    <button class="key info" data-info>${svg('i-info')} Info – Kontenauskunft</button>
  </div>
  ${warn}
  <h2 class="section">Heute</h2>
  <div class="card">
    <div class="between"><div><div class="stat-label">Arbeitszeit</div><div class="big-num num">${dur(d.net)} <span class="muted" style="font-size:16px;font-weight:500">/ ${dur(d.soll)}</span></div></div>
      <div style="text-align:right">${(d.st==='out' && d.list.length) || d.abs || d.diff > 0 || !d.soll
        ? `<div class="stat-label">Tagessaldo</div><div class="num ${sCls(d.diff)}" style="font-size:20px;font-weight:600">${dur(d.diff,true)}</div>`
        : `<div class="stat-label">Noch offen</div><div class="num" style="font-size:20px;font-weight:600;color:var(--ink-2)">${dur(d.soll - d.net)}</div>`}</div></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="row small muted" style="gap:14px;flex-wrap:wrap"><span>Brutto ${dur(d.gross)}</span><span>Pause ${dur(d.gaps + d.ded)}${d.ded?` <span class="tiny">(davon ${d.ded} Min. Pflichtabzug)</span>`:''}</span>${d.dgMin?`<span>Dienstgang ${dur(d.dgMin)}</span>`:''}${d.abs?`<span class="badge ${d.abs}">${ABS[d.abs].label}</span>`:''}</div>
    ${tl}
    ${fe}
    ${d.list.length?`<div class="actions"><button class="btn grow" data-open-day="${k}">${svg('i-edit')} Heute korrigieren</button></div>`:''}
  </div>
  <h2 class="section">Buchungshistorie</h2>
  <div class="card" style="padding:6px 12px">${historyTable()}</div>
  <div class="grid2" style="margin-top:12px">
    <div class="card"><div class="stat-label">Gleitzeit</div><div class="stat-val num ${sCls(sal.incl)}">${dur(sal.incl,true)}</div><div class="stat-sub">${sal.todayClosed?'inkl. heute':'Stand Vortag'}</div></div>
    <div class="card"><div class="stat-label">Resturlaub</div><div class="stat-val num">${fmtDays(vac.rest)} <span style="font-size:15px" class="muted">Tage</span></div><div class="stat-sub">von ${fmtDays(vac.claim)} · ${fmtDays(vac.planned)} geplant</div></div>
  </div>
  <h2 class="section">Diese Woche</h2>
  <div class="card"><div class="between small"><span class="muted">Ist / Soll</span><b class="num">${dur(wSum.ist)} / ${dur(wSum.soll)}</b></div><div class="week">${wk}</div></div>`;
}

function viewJournal(){
  const {y, m} = JM; const days = new Date(y, m+1, 0).getDate(); const t = todayKey();
  let sSoll=0, sIst=0, sDiff=0, nU=0, nK=0; const rows = [];
  for (let i = 1; i <= days; i++){
    const k = `${y}-${pad(m+1)}-${pad(i)}`; const d = calcDay(k); const dt = fromKey(k); const we = !isWorkday(k) && !d.list.length; const fut = k > t;
    if ((!fut || d.abs) && inAccount(k)){ sSoll += d.soll; sIst += d.ist; sDiff += d.diff; }
    if (d.abs==='u') nU++; if (d.abs==='hu') nU+=.5; if (d.abs==='k') nK++;
    const ins = d.list.filter(s=>s.type==='in'), outs = d.list.filter(s=>s.type==='out');
    let main = '';
    if (d.hol) main += `<span class="badge hol">${esc(d.hol)}</span>`;
    if (d.abs) main += `<span class="badge ${d.abs}">${ABS[d.abs].label}</span>`;
    if (d.absPending) main += `<span class="badge st-beantragt">${ABS[d.absPending].label} beantragt</span>`;
    if (d.list.length) main += `<div class="t num">${ins[0]?hm(ins[0].ts):'?'} – ${outs.length?hm(outs[outs.length-1].ts):(d.open?'jetzt':'?')}${d.gaps+d.ded?` <span class="muted tiny">· Pause ${dur(d.gaps+d.ded)}</span>`:''}</div>`;
    if (d.missing || d.err) main += `<span class="badge err">${svg('i-warn','i')} Buchung fehlt</span>`;
    if (d.restWarn !== null) main += `<span class="badge err">Ruhezeit ${dur(d.restWarn)}</span>`;
    if (S.settings.pauseMode==='hinweis' && d.short > 0 && !d.open) main += `<span class="badge err">Pause −${d.short} Min.</span>`;
    if (d.net > 600) main += `<span class="badge err">&gt; 10 Std.</span>`;
    if (!main) main = we ? '<span class="muted tiny">frei</span>' : fut ? `<span class="muted tiny">Soll ${dur(d.soll)}</span>` : (S.settings.startDate && k >= S.settings.startDate ? '<span class="badge err">keine Buchung</span>' : '<span class="muted tiny">–</span>');
    const right = (fut && !d.abs) || (we && !d.ist) || (!inAccount(k) && !d.list.length) ? '' : `<b class="num">${dur(d.ist)}</b><span class="num tiny ${sCls(d.diff)}">${dur(d.diff,true)}</span>`;
    rows.push(`<div class="day ${we?'we':''} ${k===t?'today':''} ${fut?'future':''}" data-open-day="${k}"><div class="d-date"><b class="num">${pad(i)}</b><span>${WD[dt.getDay()]}</span></div><div class="d-main">${main}</div><div class="d-right">${right}</div></div>`);
  }
  const endKey = `${y}-${pad(m+1)}-${pad(days)}`; const endEx = addDays(endKey,1) > t ? t : addDays(endKey,1);
  const saldoEnd = S.settings.startDate ? saldoUntil(endEx) : S.settings.startSaldo;
  return `
  <div class="month-nav"><button class="icon-btn" data-jm="-1">${svg('i-chev-l')}</button><h3>${MON[m]} ${y}</h3><button class="icon-btn" data-jm="1">${svg('i-chev-r')}</button></div>
  <div class="grid3"><div class="card sumbox"><div class="stat-label">Soll</div><div class="v num">${dur(sSoll)}</div></div><div class="card sumbox"><div class="stat-label">Ist</div><div class="v num">${dur(sIst)}</div></div><div class="card sumbox"><div class="stat-label">Saldo</div><div class="v num ${sCls(sDiff)}">${dur(sDiff,true)}</div></div></div>
  <div class="card" style="margin-top:8px;padding:12px 16px"><div class="between small"><span class="muted">Gleitzeitkonto ${addDays(endKey,1) > t ? 'aktuell' : 'zum Monatsende'}</span><b class="num ${sCls(saldoEnd)}">${dur(saldoEnd,true)}</b></div>
  <div class="between small" style="margin-top:4px"><span class="muted">Urlaub / Krank in diesem Monat</span><b class="num">${fmtDays(nU)} / ${nK} Tage</b></div></div>
  <div class="days">${rows.join('')}</div>
  <div class="actions"><button class="btn grow" id="csvBtn">${svg('i-down')} CSV-Export</button><button class="btn grow" id="pdfBtn">${svg('i-print')} Monatsnachweis (PDF)</button></div>`;
}

function dayEditor(k){
  const d = calcDay(k);
  let rows = d.list.map(s => ({id:s.id, type:s.type, time:hm(s.ts), src:s.src}));
  const absE = ABSMAP[k];
  const drawRows = el => {
    $('#edRows', el).innerHTML = rows.length ? rows.map((r,i)=>`<div class="edit-row">
      <select class="input" data-r="${i}" data-f="type">${Object.keys(KIND).map(t=>`<option value="${t}" ${t===r.type?'selected':''}>${KIND[t].label}</option>`).join('')}</select>
      <input class="input num" type="time" value="${r.time}" data-r="${i}" data-f="time">
      <button class="icon-btn" data-del="${i}" aria-label="Löschen">${svg('i-trash')}</button></div>`).join('') : '<div class="empty-state">Keine Buchungen an diesem Tag.</div>';
    $$('[data-f]', el).forEach(inp => inp.onchange = () => { rows[+inp.dataset.r][inp.dataset.f] = inp.value; });
    $$('[data-del]', el).forEach(b => b.onclick = () => { rows.splice(+b.dataset.del,1); drawRows(el); });
  };
  sheet(`<h3>${longDate(k)}</h3>
    <div class="sub">${d.hol?esc(d.hol)+' · ':''}Soll ${dur(d.soll)} · Ist ${dur(d.ist)} · <span class="${sCls(d.diff)}">${dur(d.diff,true)}</span></div>
    <div class="kv"><div class="muted">Anwesenheit (brutto)</div><div class="num">${dur(d.gross)}</div><div class="muted">Pause gebucht</div><div class="num">${dur(d.gaps)}</div><div class="muted">davon als Ruhepause gültig (≥ 15 Min.)</div><div class="num">${dur(d.legal)}</div><div class="muted">Automatischer Pausenabzug</div><div class="num">${S.settings.pauseMode==='abzug'?dur(d.ded):'aus'}</div>${d.short&&S.settings.pauseMode==='hinweis'?`<div class="neg">Fehlende Pflichtpause</div><div class="num neg">${d.short} Min.</div>`:''}${d.restWarn!==null?`<div class="neg">Ruhezeit seit Vortag</div><div class="num neg">${dur(d.restWarn)} Std.</div>`:''}<div class="muted"><b>Netto-Ist</b></div><div class="num">${dur(d.net)}</div>${d.dgMin?`<div class="muted">davon Dienstgang</div><div class="num">${dur(d.dgMin)}</div>`:''}${d.abs?`<div class="muted">Gutschrift ${ABS[d.abs].label}</div><div class="num">${dur(d.credit)}</div>`:''}</div>
    ${absE?`<div class="alert" style="cursor:default">${svg('i-cal')}<div><b>${ABS[absE.type].label}</b> ${absE.pending?'(beantragt, noch nicht genehmigt)':'(genehmigt)'}<br><span class="small">Ändern kannst du das im Reiter „Abwesenheit“.</span></div></div>`:''}
    <h2 class="section" style="margin-top:18px">Buchungen</h2>
    <div id="edRows"></div>
    <button class="btn block" id="edAdd" style="margin-top:10px">${svg('i-plus')} Buchung hinzufügen</button>
    <div class="field"><label>Grund der Korrektur</label><input class="input" id="edWhy" placeholder="z. B. Stempeln vergessen"></div>
    <div class="actions"><button class="btn grow" data-x>Abbrechen</button><button class="btn grow primary" id="edSave">Speichern</button></div>
    ${!absE && isWorkday(k) ? `<button class="btn block" id="edAbs" style="margin-top:10px">${svg('i-cal')} Abwesenheit für diesen Tag eintragen</button>`:''}`,
  (el, close) => {
    drawRows(el);
    $('[data-x]', el).onclick = close;
    $('#edAdd', el).onclick = () => { const st = stateAfter(rows.map(r=>({type:r.type}))); rows.push({id:null, type:nextAuto(st)||'in', time: rows.length ? rows[rows.length-1].time : '08:00', src:'korr'}); drawRows(el); };
    $('#edAbs', el) && ($('#edAbs', el).onclick = () => { close(); setTimeout(()=>requestEditor({from:k,to:k}), 240); });
    $('#edSave', el).onclick = async () => {
      const why = $('#edWhy', el).value.trim();
      const base = fromKey(k);
      const newList = rows.filter(r=>r.time).map(r => { const [h,mi] = r.time.split(':').map(Number); const dt = new Date(base); dt.setHours(h, mi, 0, 0); return {id:r.id||uid(), ts:dt.getTime(), type:r.type, src:r.src||'korr'}; }).sort((a,b)=>a.ts-b.ts);
      const oldStr = d.list.map(s=>`${hm(s.ts)} ${KIND[s.type].label}`).join(', ') || '–';
      const newStr = newList.map(s=>`${hm(s.ts)} ${KIND[s.type].label}`).join(', ') || '–';
      if (oldStr === newStr){ close(); return; }
      // Konsistenz prüfen
      let st = 'out', bad = false; for (const s of newList){ if (!ALLOWED[st].includes(s.type)) bad = true; st = TARGET[s.type]; }
      if (!why){ $('#edWhy', el).focus(); toast('Bitte einen Grund für die Korrektur angeben'); return; }
      if (bad){ toast('Reihenfolge nicht schlüssig (z. B. zweimal Kommen) – bitte prüfen'); return; }
      const changed = newList.map(s => { const old = d.list.find(o=>o.id===s.id); return (old && old.ts===s.ts && old.type===s.type) ? s : {...s, src: old && old.ts===s.ts ? old.src : 'korr'}; });
      S.stamps = S.stamps.filter(s => dkey(new Date(s.ts)) !== k).concat(changed);
      if (!S.settings.startDate || k < S.settings.startDate) S.settings.startDate = k;
      log(`Korrektur ${shortDate(k)}: ${oldStr} → ${newStr}. Grund: ${why}`);
      S.requests.unshift({id:uid(), kind:'korr', date:k, before:oldStr, after:newStr, note:why, status:'genehmigt', created:Date.now(), decided:Date.now()});
      save(); close(); render(); toast('Korrektur gespeichert ✓');
    };
  });
}

function viewKonten(){
  const sal = saldoNow(); const vac = vacation(); const y = new Date().getFullYear(); const t = todayKey();
  const mStart = t.slice(0,8) + '01'; let mDiff = 0, mIst = 0, mSoll = 0;

let VSEL = {};
const WDLONG = k => { const d = fromKey(k); return `${WDL[d.getDay()]}, ${shortDate(k)}`; };
function vacRanges(sel = VSEL){
  const keys = Object.keys(sel).sort(); const out = [];
  const onlyFreeBetween = (a, b) => { for (let k = addDays(a,1); k < b; k = addDays(k,1)) if (isWorkday(k)) return false; return true; };
  for (const k of keys){
    const half = sel[k] === .5; const last = out[out.length-1];
    if (last && !half && !last.half && onlyFreeBetween(last.to, k)){ last.to = k; last.days += 1; }
    else out.push({from:k, to:k, half, days: sel[k]});
  }
  return out;
}
const fmtTage = n => `${fmtDays(n)} ${n===1?'Arbeitstag':'Arbeitstage'}`;
function rangeText(r){
  if (r.half) return `${WDLONG(r.from)} (halber Tag)`;
  if (r.from === r.to) return `${WDLONG(r.from)} (1 Arbeitstag)`;
  return `${WDLONG(r.from)} bis ${WDLONG(r.to)} (${fmtTage(r.days)})`;
}

async function gasSend(payload){
  if (!navigator.onLine) return {ok:false, error:'keine Internetverbindung'};
  try {
    const r = await fetch(S.settings.gasUrl, {method:'POST', body: JSON.stringify(payload)});
    const j = await r.json().catch(() => null);
    if (j && j.ok) return {ok:true};
    return {ok:false, error: j && j.error === 'unauthorized' ? 'Schlüssel passt nicht – Einrichtung prüfen' : (j && j.error) || ('Fehler ' + r.status)};
  } catch(e){ return {ok:false, error:'Script nicht erreichbar – Adresse prüfen'}; }
}

function gasScript(){
  return `// Stempeluhr – Versand von Urlaubsanträgen über dein Gmail
// Nicht weitergeben: Der Schlüssel unten schützt dein Script.
const SCHLUESSEL = '${S.settings.gasToken}';

function doPost(e) {
  try {
    const d = JSON.parse(e.postData.contents);
    if (d.token !== SCHLUESSEL) return antwort({ ok: false, error: 'unauthorized' });
    if (d.test) return antwort({ ok: true, test: true });
    const opt = { name: d.fromName || '' };
    if (d.cc) opt.cc = d.cc;
    if (d.pdfHtml) {
      opt.attachments = [Utilities.newBlob(d.pdfHtml, 'text/html', 'antrag.html').getAs('application/pdf').setName(d.pdfName || 'Urlaubsantrag.pdf')];
    }
    GmailApp.sendEmail(d.to, d.subject, d.body, opt);
    return antwort({ ok: true });
  } catch (err) {
    return antwort({ ok: false, error: String(err) });
  }
}

function antwort(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

`;
}

const TEAM = [['Anna Berger','Vertrieb'],['Markus Huber','Vertrieb'],['Sabine Wolf','Innendienst'],['Jonas Maier','Lager'],['Lea Schmid','Buchhaltung'],['Tom Richter','Technik']];
function hash(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h>>>0)/4294967295; }
function teamStatus(name){
  const k = todayKey(); const nowM = minOfDay(Date.now()); const r = hash(name+k);
  if (!isWorkday(k)) return {s:'out', t:'frei'};
  if (r < .1) return {s:'abs', t:'Urlaub'};
  if (r < .15) return {s:'abs', t:'Krank / abwesend'};
  const start = 420 + Math.floor(hash(name+'s'+k)*75), end = start + 540 + Math.floor(hash(name+'e'+k)*50);
  const ps = 720 + Math.floor(hash(name+'p'+k)*45);
  if (nowM < start || nowM >= end) return {s:'out', t: nowM < start ? 'noch nicht da' : `gegangen ${pad(Math.floor(end/60))}:${pad(end%60)}`};
  if (nowM >= ps && nowM < ps+30) return {s:'pause', t:'Pause'};
  if (r > .85 && nowM > 600 && nowM < 840) return {s:'dg', t:'Dienstgang'};
  return {s:'in', t:`anwesend seit ${pad(Math.floor(start/60))}:${pad(start%60)}`};
}

    <div class="card" style="box-shadow:none;margin-top:16px;padding:4px 14px">
      <label class="switch"><span><b>Buchungsbestätigung</b><br><span class="small muted">Vor jeder Buchung per Taste nachfragen</span></span><input type="checkbox" class="toggle" id="pConf" ${s.confirmBooking?'checked':''}></label>
      <label class="switch"><span><b>Signalton</b><br><span class="small muted">Piepton bei jeder Buchung</span></span><input type="checkbox" class="toggle" id="pSound" ${s.sound?'checked':''}></label>
      <label class="switch"><span><b>Genehmigung simulieren</b><br><span class="small muted">Anträge erst nach Freigabe gültig (Demo-Workflow)</span></span><input type="checkbox" class="toggle" id="pAppr" ${s.approval==='manual'?'checked':''}></label>
      <label class="switch"><span><b>Mariä Himmelfahrt (15.08.)</b><br><span class="small muted">Feiertag in Gemeinden mit kath. Mehrheit</span></span><input type="checkbox" class="toggle" id="pMar" ${s.mariae?'checked':''}></label>
    </div>
    <div class="field"><label>Darstellung</label><div class="seg-ctl" id="pTheme">${[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']].map(([v,l])=>`<button data-v="${v}" class="${s.theme===v?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="small muted" style="margin-top:12px">Feiertage: Bayern</div>
    <div class="actions"><button class="btn grow" data-x>Abbrechen</button><button class="btn grow primary" id="pSave">Speichern</button></div>`,
  (el, close) => {
    let theme = s.theme;
    $$('#pTheme button', el).forEach(b => b.onclick = () => { theme = b.dataset.v; $$('#pTheme button', el).forEach(x=>x.classList.toggle('on', x===b)); });
    $('[data-x]', el).onclick = close;
    $('#pSave', el).onclick = () => {
      Object.assign(s, {name:$('#pName',el).value.trim(), confirmBooking:$('#pConf',el).checked, sound:$('#pSound',el).checked, approval:$('#pAppr',el).checked?'manual':'auto', mariae:$('#pMar',el).checked, theme});
      HOL = {}; applyTheme(); save(); close(); render(); toast('Gespeichert ✓');
    };
  });
}
function dataSheet(){
  sheet(`<h3>Daten & Export</h3><div class="sub">Deine Daten liegen nur auf diesem Handy. Mach ab und zu eine Sicherung.</div>
    <div class="actions"><button class="btn grow" id="bkSave">${svg('i-down')} Sicherung speichern</button><button class="btn grow" id="bkLoad">${svg('i-up')} Sicherung laden</button></div>
    <input type="file" id="bkFile" accept="application/json,.json" class="hidden">
    <h2 class="section">Vorführung</h2>
    <div class="card" style="box-shadow:none"><div class="small">Füllt die App mit realistischen Beispielbuchungen der letzten Wochen, Urlaub, Krankheit und offenen Anträgen – ideal, um sie in der Firma zu zeigen.</div>
      <div class="actions">${S.demo?`<button class="btn grow danger" id="demoOff">Demo-Daten entfernen</button>`:`<button class="btn grow primary" id="demoOn">Demo-Daten laden</button>`}</div></div>
    <h2 class="section">Zurücksetzen</h2>
    <button class="btn block danger" id="wipe">${svg('i-trash')} Alle Daten löschen</button>
    <div class="actions"><button class="btn block" data-x>Schließen</button></div>`,
  (el, close) => {
    $('[data-x]', el).onclick = close;
    $('#bkSave', el).onclick = () => { saveBackup(); close(); };
    $('#bkLoad', el).onclick = () => $('#bkFile', el).click();
    $('#bkFile', el).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.stamps)) throw 0;
        const ok = await dialog('Sicherung laden?', `Enthält ${d.stamps.length} Buchungen. Die aktuellen Daten werden ersetzt.`, [{label:'Abbrechen'},{label:'Laden', primary:true, value:true}]);
        if (!ok) return; const def = defaults(); d.settings = Object.assign(def.settings, d.settings||{}); S = Object.assign(def, d); HOL = {}; save(); close(); render(); toast('Sicherung geladen ✓');
      } catch(_){ toast('Datei ist keine gültige Sicherung'); }
    };
    $('#demoOn', el) && ($('#demoOn', el).onclick = async () => {
      const ok = S.stamps.length ? await dialog('Demo-Daten laden?', 'Deine echten Buchungen werden vorher gesichert und beim Entfernen der Demo wiederhergestellt.', [{label:'Abbrechen'},{label:'Laden', primary:true, value:true}]) : true;
      if (!ok) return; loadDemo(); close(); TAB='buchen'; render(); toast('Demo-Daten geladen');
    });
    $('#demoOff', el) && ($('#demoOff', el).onclick = () => { unloadDemo(); close(); render(); toast('Demo entfernt – deine Daten sind wiederhergestellt'); });
    $('#wipe', el).onclick = async () => {
      const ok = await dialog('Wirklich alles löschen?', 'Alle Buchungen, Anträge und Einstellungen werden unwiderruflich gelöscht.', [{label:'Abbrechen'},{label:'Alles löschen', danger:true, value:true}]);
      if (!ok) return; S = defaults(); try{ localStorage.removeItem(KEY+'.backup'); }catch(_){} save(); close(); render(); toast('Alle Daten gelöscht');
    };
  });
}
function logSheet(){
  sheet(`<h3>Protokoll</h3><div class="sub">Nachvollziehbarkeit aller Änderungen</div>
    <div class="card" style="box-shadow:none;margin-top:8px">${S.log.length?S.log.slice(0,150).map(l=>`<div class="log-item"><div class="tiny muted num">${new Date(l.ts).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}</div>${esc(l.text)}</div>`).join(''):'<div class="empty-state">Noch keine Einträge.</div>'}</div>
    <div class="actions"><button class="btn block" data-x>Schließen</button></div>`, (el,c)=>$('[data-x]',el).onclick=c);
}

/* ============ Demo ============ */
function loadDemo(){
  try { if (!S.demo) localStorage.setItem(KEY+'.backup', JSON.stringify(S)); } catch(_){}
  const keep = S.settings; const t = todayKey(); const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const D = defaults(); D.settings = Object.assign({}, keep, {chips:keep.chips}); D.demo = true;
  const start = addDays(t, -42 - ((fromKey(t).getDay()+6)%7)); D.settings.startDate = start; D.settings.startSaldo = 135; D.settings.urlaubVorjahr = 3;
  const mk = (k, mins, type, src) => { const d = fromKey(k); d.setHours(Math.floor(mins/60), mins%60, rnd(0,59), 0); return {id:uid(), ts:d.getTime(), type, src}; };
  const uFrom = addDays(start, 15), uTo = addDays(start, 18); const krank = addDays(start, 29);
  D.requests.push({id:uid(), kind:'abs', type:'u', from:uFrom, to:uTo, note:'Herbsturlaub', status:'genehmigt', created:fromKey(start).getTime(), decided:fromKey(start).getTime()+864e5});
  D.requests.push({id:uid(), kind:'abs', type:'k', from:krank, to:krank, note:'AU-Bescheinigung liegt vor', status:'genehmigt', created:fromKey(krank).getTime(), decided:fromKey(krank).getTime()});
  const fu = addDays(t, 16 + ((8 - fromKey(addDays(t,16)).getDay()) % 7));
  D.requests.push({id:uid(), kind:'abs', type:'u', from:fu, to:addDays(fu,4), note:'Skiurlaub', status:'beantragt', created:Date.now()-3*864e5});
  D.requests.push({id:uid(), kind:'abs', type:'gt', from:addDays(t,9), to:addDays(t,9), note:'', status:'beantragt', created:Date.now()-864e5});
  const tmp = {...S}; S = D; reindex();
  for (let k = start; k < t; k = addDays(k,1)){
    if (!isWorkday(k) || ABSMAP[k]) continue;
    const fri = fromKey(k).getDay() === 5; const a = rnd(462, 492); const e = (fri ? 960 : 1020) + rnd(-8, 38);
    const r = Math.random(); D.stamps.push(mk(k, a, 'in', Math.random()<.85?'nfc':'app'));
    if (r < .55){ const p = rnd(715, 745); D.stamps.push(mk(k, p, 'ps', 'nfc'), mk(k, p + rnd(28,36), 'pe', 'nfc')); }
    if (r > .9){ const g = rnd(600, 660); D.stamps.push(mk(k, g, 'ds', 'app'), mk(k, g + rnd(60,110), 'de', 'app')); }
    D.stamps.push(mk(k, e, 'out', Math.random()<.85?'nfc':'app'));
  }
  // eine vergessene Gehen-Buchung vorgestern für die Vorführung der Korrektur
  const miss = (()=>{ for (let i = 2; i < 8; i++){ const k = addDays(t,-i); if (isWorkday(k) && !ABSMAP[k]) return k; } })();
  if (miss){ D.stamps = D.stamps.filter(s => !(dkey(new Date(s.ts))===miss && s.type==='out')); }
  // heute: eingestempelt, falls Arbeitstag und nach 8 Uhr
  const nowM = minOfDay(Date.now());
  if (isWorkday(t) && nowM > 480){ D.stamps.push(mk(t, Math.min(nowM-1, rnd(465,485)), 'in', 'nfc')); }
  D.log.unshift({ts:Date.now(), text:'Demo-Daten geladen'});
  const corrDay = addDays(start, 9);
  D.requests.push({id:uid(), kind:'korr', date:corrDay, before:'07:52 Kommen', after:'07:52 Kommen, 17:10 Gehen', note:'Stempeln vergessen', status:'genehmigt', created:fromKey(corrDay).getTime()+864e5});
  S = D; save();
}
function unloadDemo(){
  let restored = null; try { const raw = localStorage.getItem(KEY+'.backup'); if (raw) restored = JSON.parse(raw); localStorage.removeItem(KEY+'.backup'); } catch(_){}
  const keepSettings = S.settings;
  if (restored){ const def = defaults(); restored.settings = Object.assign(def.settings, restored.settings||{}); S = Object.assign(def, restored); }
  else { S = defaults(); S.settings = Object.assign(S.settings, keepSettings, {startDate:null, startSaldo:0}); }
  S.demo = false; HOL = {}; save();
}

/* ============ Export ============ */
function saveBackup(){
  download(`stempeluhr-sicherung-${todayKey()}.json`, JSON.stringify(S, null, 1), 'application/json');
  S.settings.lastBackup = Date.now(); log('Sicherung gespeichert'); save(); render(); toast('Sicherung gespeichert – liegt in „Downloads“');
}
function download(name, content, type){
  const blob = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const dec = m => (m/60).toFixed(2).replace('.', ',');
function monthRows(y, m){
  const days = new Date(y, m+1, 0).getDate(); const out = [];
  for (let i = 1; i <= days; i++){
    const k = `${y}-${pad(m+1)}-${pad(i)}`; const d = calcDay(k);
    const books = d.list.map(s=>`${hm(s.ts)} ${KIND[s.type].label}`).join(', ');
    const ins = d.list.filter(s=>s.type==='in'), outs = d.list.filter(s=>s.type==='out');
    out.push({k, d, wd:WD[fromKey(k).getDay()], kommen: ins[0]?hm(ins[0].ts):'', gehen: outs.length?hm(outs[outs.length-1].ts):'', books,
      bem: [d.hol, d.abs?ABS[d.abs].label:'', d.missing||d.err?'Buchung fehlt':''].filter(Boolean).join(', ')});
  }
  return out;
}
function exportCSV(){
  const {y, m} = JM; const rows = monthRows(y, m); const t = todayKey();
  const lines = [['Datum','Wochentag','Kommen','Gehen','Buchungen','Pause (h)','Ist (h)','Soll (h)','Saldo (h)','Bemerkung'].join(';')];
  for (const r of rows){ const fut = r.k > t && !r.d.abs; lines.push([shortDate(r.k), r.wd, r.kommen, r.gehen, `"${r.books}"`, fut?'':dec(r.d.gaps+r.d.ded), fut?'':dec(r.d.ist), dec(r.d.soll), fut?'':dec(r.d.diff), `"${r.bem}"`].join(';')); }
  download(`Zeitnachweis-${y}-${pad(m+1)}.csv`, '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('CSV exportiert');
}
function exportPDF(){
  const {y, m} = JM; const rows = monthRows(y, m); const t = todayKey();
  let sS=0, sI=0, sD=0;
  const tr = rows.map(r => { const fut = r.k > t && !r.d.abs; if(!fut && inAccount(r.k)){ sS+=r.d.soll; sI+=r.d.ist; sD+=r.d.diff; }
    const we = !isWorkday(r.k) && !r.d.list.length;
    return `<tr class="${we?'we':''}"><td>${r.wd} ${shortDate(r.k).slice(0,6)}</td><td>${r.kommen}</td><td>${r.gehen}</td><td class="r">${fut||we?'':dur(r.d.gaps+r.d.ded)}</td><td class="r">${fut||(we&&!r.d.ist)?'':dur(r.d.ist)}</td><td class="r">${dur(r.d.soll)}</td><td class="r">${fut||(we&&!r.d.ist)?'':dur(r.d.diff,true)}</td><td>${esc(r.bem)}</td></tr>`; }).join('');
  const endKey = `${y}-${pad(m+1)}-${pad(rows.length)}`; const endEx = addDays(endKey,1) > t ? t : addDays(endKey,1);
  $('#print').innerHTML = `<h1>Arbeitszeitnachweis ${MON[m]} ${y}</h1>
    <div class="meta"><span>Mitarbeiter: <b>${esc(S.settings.name||'')}</b></span><span>Erstellt: ${new Date().toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'})}</span></div>
    <table><thead><tr><th>Tag</th><th>Kommen</th><th>Gehen</th><th class="r">Pause</th><th class="r">Ist</th><th class="r">Soll</th><th class="r">Saldo</th><th>Bemerkung</th></tr></thead>
    <tbody>${tr}<tr class="tot"><td colspan="4">Summe</td><td class="r">${dur(sI)}</td><td class="r">${dur(sS)}</td><td class="r">${dur(sD,true)}</td><td></td></tr></tbody></table>
    <p>Gleitzeitkonto: <b>${dur(saldoUntil(endEx),true)}</b> · Resturlaub: <b>${fmtDays(vacation(y).rest)} Tage</b></p>
    <div class="sign"><div>Datum, Unterschrift Mitarbeiter</div><div>Datum, Unterschrift Vorgesetzter</div></div>`;
  setTimeout(()=>window.print(), 50);
}

/* ============ Ereignisse ============ */
function bindView(){
  const v = $('#view');
  $$('[data-book]', v).forEach(b => b.onclick = () => book(b.dataset.book, 'app'));
  $$('[data-info]', v).forEach(b => b.onclick = infoSheet);
  $$('[data-open-day]', v).forEach(b => b.onclick = () => dayEditor(b.dataset.openDay));
  $('#nfcOn', v) && ($('#nfcOn', v).onclick = () => nfcStart());
  $('#nfcOff', v) && ($('#nfcOff', v).onclick = nfcStop);
  $$('[data-jm]', v).forEach(b => b.onclick = () => { JM.m += +b.dataset.jm; if (JM.m<0){JM.m=11;JM.y--;} if (JM.m>11){JM.m=0;JM.y++;} render(); });
  $$('[data-cm]', v).forEach(b => b.onclick = () => { CM.m += +b.dataset.cm; if (CM.m<0){CM.m=11;CM.y--;} if (CM.m>11){CM.m=0;CM.y++;} render(); });
  $$('[data-cal]', v).forEach(c => c.onclick = () => {
    const k = c.dataset.cal; const a = ABSMAP[k];
    if (a){ const r = S.requests.find(x=>x.id===a.id); toast(`${ABS[a.type].label} · ${r?r.status:''}`); return; }
    if (!isWorkday(k)){ toast(holidayOf(k) || 'Kein Arbeitstag'); return; }
    if (k < todayKey()){ requestEditor({from:k, type:'k'}); return; }
    const cur = VSEL[k]; if (!cur) VSEL[k] = 1; else if (cur === 1) VSEL[k] = .5; else delete VSEL[k];
    render();
  });
  $('#selClear', v) && ($('#selClear', v).onclick = () => { VSEL = {}; render(); });
  $('#selMail', v) && ($('#selMail', v).onclick = () => vacationMail());
  $('#newReq', v) && ($('#newReq', v).onclick = () => requestEditor({type:'k'}));
  $$('[data-approve]', v).forEach(b => b.onclick = () => setReq(b.dataset.approve, 'genehmigt'));
  $$('[data-reject]', v).forEach(b => b.onclick = () => setReq(b.dataset.reject, 'abgelehnt'));
  $$('[data-storno]', v).forEach(b => b.onclick = async () => { const ok = await dialog('Antrag stornieren?', 'Die Abwesenheit wird wieder aus dem Kalender entfernt.', [{label:'Nein'},{label:'Stornieren', danger:true, value:true}]); if (ok) setReq(b.dataset.storno, 'storniert'); });
  $('#csvBtn', v) && ($('#csvBtn', v).onclick = exportCSV);
  $('#pdfBtn', v) && ($('#pdfBtn', v).onclick = exportPDF);
  $$('[data-backup]', v).forEach(b => b.onclick = saveBackup);
  $$('[data-menu]', v).forEach(b => b.onclick = () => ({team:teamSheet, log:logSheet, nfc:nfcSheet, work:workSheet, prefs:prefsSheet, data:dataSheet, mail:mailSettingsSheet})[b.dataset.menu]());
  $('#installBtn', v) && ($('#installBtn', v).onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); });
}
$$('nav.tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); window.scrollTo({top:0}); });
function applyTheme(){ const t = S.settings.theme; if (t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
$('#themeBtn').onclick = () => { const dark = document.documentElement.getAttribute('data-theme')==='dark' || (S.settings.theme==='auto' && matchMedia('(prefers-color-scheme: dark)').matches); S.settings.theme = dark ? 'light' : 'dark'; applyTheme(); save(); };
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (TAB==='mehr') render(); });

// Uhr & Live-Aktualisierung
let lastMin = -1;
setInterval(() => {
  const n = new Date(); const c = $('#clock');
  if (c) c.innerHTML = `${pad(n.getHours())}:${pad(n.getMinutes())}<span class="sec">${pad(n.getSeconds())}</span>`;
  const sd = $('#statusDur'); if (sd && sd.dataset.since) sd.textContent = sinceText(+sd.dataset.since);
  if (n.getMinutes() !== lastMin){ lastMin = n.getMinutes(); if (TAB==='buchen' && !document.querySelector('.scrim')) render(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ render(); } });

/* ============ Start ============ */
applyTheme(); reindex();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(_){}
(function handleLink(){
  const p = new URLSearchParams(location.search); const st = p.get('stempel');
  if (p.has('stempel') || p.has('tab')) history.replaceState(null, '', location.pathname);
  if (p.get('tab')) TAB = p.get('tab');
  render();
  if (st) setTimeout(() => book(st==='kommen'?'in':st==='gehen'?'out':'auto', 'nfc'), 150);
})();
// Chip-Leser automatisch starten, wenn bereits erlaubt
if (NFC.supported && navigator.permissions){ navigator.permissions.query({name:'nfc'}).then(r => { if (r.state === 'granted' && !S.settings.nfcOff) nfcStart(true); }).catch(()=>{}); }
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => { r.update().catch(()=>{}); document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update().catch(()=>{}); }); }).catch(()=>{});
  // Neue Version übernommen → einmal neu laden, damit sie sofort sichtbar ist
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded && !document.querySelector('.scrim') && !$('#confirm').classList.contains('show')){ reloaded = true; location.reload(); } });
}
</script>
